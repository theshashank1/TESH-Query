[build-system]
requires = [
    "setuptools>=61.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "teshq"
version = "2.0.0"
description = "A CLI tool that converts natural language queries into SQL and returns relevant tables using natural language."
readme = "README.md"
requires-python = ">=3.10"
# Use the license file so packaging tools pick it up
license = { file = "LICENSE" }
keywords = ["sql", "cli", "database", "natural language", "AI", "LLM"]
authors = [
  { name = "Shashank", email = "shashankgundas1@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# Core runtime dependencies — intentionally broad upper bounds so the package
# installs cleanly in modern environments while still receiving security fixes.
dependencies = [
    "SQLAlchemy>=2.0,<3.0",
    "python-dotenv>=1.0",
    # PostgreSQL: NOT a hard dep — install the 'postgres' extra or set it up separately.
    # psycopg2-binary has no Python 3.13+ wheel yet; asyncpg is the recommended alternative.
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.0",
    "typer>=0.9,<1.0",
    "rich>=13.0,<15.0",
    "logfire>=2.0",
    "tabulate>=0.9",
    "pandas>=2.0",          # Allowing >=2.3 which may have pre-built cp314 wheels
    "pyyaml~=6.0",
    "pydantic~=2.0",
    "pydantic-settings~=2.0",
    "email-validator>=2.0.0",  # Required by pydantic EmailStr validation
    "requests>=2.31.0",         # Required for subscription client
    "sqlparse>=0.4.4",           # SQL normalization
    "tomli>=2.0.0; python_version < '3.11'",  # TOML stdlib in 3.11+
    "langchain-openai>=0.2",     # Azure OpenAI / OpenAI support
]

[project.optional-dependencies]
# Development & CI tools
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=1.0",
    "autopep8>=2.0",
    "pre-commit>=3.0",
    "flake8>=6.0",
    "isort>=5.12",
    "build",
    "mkdocs-material",
]

# Database drivers that are supported but not installed by default.
# SQLite: builtin to Python (no extra package).
# PostgreSQL: psycopg2-binary is included in core dependencies above.

# PostgreSQL via pure-Python driver (no pg_config / system packages needed)
# Works on Python 3.9–3.14+
postgres = [
    "asyncpg>=0.29",             # Async pure-Python PostgreSQL (recommended, no build deps)
]

# PostgreSQL via psycopg2-binary (pre-built wheel — Python 3.9–3.12 only)
# If binary wheel is not available for your Python version, use the 'postgres' extra instead.
postgres-binary = [
    "psycopg2-binary>=2.9",
]

# MySQL support (pure Python, no system dependencies)
mysql = [
    "PyMySQL>=1.1",
    "mysql-connector-python>=8.4",
]

# MariaDB support (REQUIRES SYSTEM DEPENDENCIES)
# Before installing: sudo apt-get install libmariadb-dev (Debian/Ubuntu)
#                    or brew install mariadb-connector-c (macOS)
mariadb = [
    "PyMySQL>=1.0",  # Pure Python, works with MariaDB, no system deps required
]

# MariaDB native driver (use only if you have MariaDB Connector/C installed)
mariadb-native = [
    "mariadb>=1.1",  # Requires: libmariadb-dev or mariadb-connector-c
]

# Microsoft SQL Server support
mssql = [
    "pymssql>=2.2",  # Pure Python, recommended (easier to install)
]

# MSSQL with ODBC (REQUIRES SYSTEM DEPENDENCIES)
mssql-odbc = [
    "pyodbc>=4.0",  # Requires: ODBC driver installed on system
]

# Oracle support (REQUIRES SYSTEM DEPENDENCIES)
oracle = [
    "oracledb>=2.0",  # Requires: Oracle Instant Client
]

# Cassandra support
cassandra = [
    "cassandra-driver>=3.29",
]

# Extras for data export / Excel output
export = [
    "openpyxl>=3.1",
]

# Analytics and monitoring (optional)
langsmith = [
    "langsmith>=0.1",
]

# Convenience "all" extra - installs drivers that DON'T require system dependencies
all = [
    "PyMySQL>=1.1",
    "mysql-connector-python>=8.4",
    "pymssql>=2.2",
    "openpyxl>=3.1",
    "mkdocs-material",
]

# Full extras including drivers that require system dependencies
# USE WITH CAUTION - ensure you have all system dependencies installed first
all-native = [
    "PyMySQL>=1.1",
    "mysql-connector-python>=8.4",
    "mariadb>=1.1",
    "pyodbc>=4.0",
    "pymssql>=2.2",
    "oracledb>=2.0",
    "openpyxl>=3.1",
    "mkdocs-material",
]

# All database drivers
all-databases = [
    "PyMySQL>=1.1",
    "mysql-connector-python>=8.4",
    "oracledb>=2.0",
    "cassandra-driver>=3.29",
]

# All optional features
all-features = [
    "PyMySQL>=1.1",
    "mysql-connector-python>=8.4",
    "oracledb>=2.0",
    "cassandra-driver>=3.29",
    "langsmith>=0.1",
]

[project.urls]
Homepage = "https://github.com/theshashank1/TESH-Query"
"Bug Tracker" = "https://github.com/theshashank1/TESH-Query/issues"
Documentation = "https://github.com/theshashank1/TESH-Query#readme"

[project.scripts]
teshq = "teshq.cli.main:main"

[tool.setuptools]
packages = [
    "teshq",
    "teshq.cli",
    "teshq.cli.ui",
    "teshq.config",
    "teshq.core",
    "teshq.telemetry",
    "teshq.subscriptions",
    "teshq.utils",
]
include-package-data = true

# ---------------------------------------------------------------------------
# uv configuration
# ---------------------------------------------------------------------------
[tool.uv]
# These packages require system libraries (pg_config, libmariadb, ODBC, etc.)
# to build from source. Tell uv to always use pre-built binary wheels.
# If no binary wheel is available for the current Python version, the install
# will fail with a clear message instead of a confusing build error.
no-build-package = [
    "psycopg2-binary",
    "psycopg2",
    "greenlet",          # SQLAlchemy async dep; pure source build is slow
    "pyodbc",
    "mariadb",
    "cffi",              # transitive dep; requires MSVC on Windows
    "grpcio",            # google-genai dep; binary wheels available on PyPI
    "orjson",            # rust extension; pre-built wheels available on PyPI
    # pandas intentionally omitted: cp314 wheels not yet published.
    # Users on Python 3.14 can skip pandas; core logic does not require it.
]

# Force newer zstandard which has pre-built wheels for Python 3.14 on Windows.
# langsmith pins to 0.23.0 which has no cp314 wheel and requires MSVC.
override-dependencies = [
    "zstandard>=0.25.0",
]

# ---------------------------------------------------------------------------
# Pytest configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
