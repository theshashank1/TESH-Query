name: PyPI Stable Release

# Triggered ONLY when a stable version tag is pushed (no .dev suffix).
# Guard job enforces the tag must come from the main branch.
# Example tag: v3.0.0

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"   # Pure semver only e.g. v3.0.0 (NOT v3.0.0.dev1)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Gate: block if tag is not on main branch ─────────────────────────────
  guard:
    name: Verify tag is on main branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Confirm tag commit is reachable from main
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          TAG_COMMIT=$(git rev-list -n1 "refs/tags/$TAG")
          echo "Tag:        $TAG"
          echo "Tag commit: $TAG_COMMIT"

          # Ensure origin/main is fetched
          git fetch origin main --depth=0 || git fetch origin main

          if ! git merge-base --is-ancestor "$TAG_COMMIT" "origin/main"; then
            echo "FAIL: tag '$TAG' is not on the main branch."
            echo "Stable releases must be tagged from the main branch only."
            exit 1
          fi
          echo "OK: tag is reachable from main branch."

      - name: Confirm tag is NOT a dev pre-release
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" == *".dev"* ]] || [[ "$TAG" == *"a"* && "$TAG" =~ [0-9]a[0-9] ]] || [[ "$TAG" == *"b"* && "$TAG" =~ [0-9]b[0-9] ]] || [[ "$TAG" == *"rc"* && "$TAG" =~ [0-9]rc[0-9] ]]; then
            echo "FAIL: '$TAG' appears to be a pre-release tag."
            echo "For dev/pre-releases use deploy_dev.yaml."
            exit 1
          fi
          echo "OK: '$TAG' is a stable release tag."

  # ── Build, test, and publish ─────────────────────────────────────────────
  publish:
    name: Build and Publish Stable Release to PyPI
    runs-on: ubuntu-latest
    needs: guard
    permissions:
      id-token: write   # OIDC trusted publishing (no API token needed)
      contents: write   # GitHub Releases

    environment:
      name: pypi
      url: https://pypi.org/p/teshq

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build and test tools
        run: |
          python -m pip install --upgrade pip
          pip install build wheel twine setuptools setuptools-scm pytest pytest-cov
          pip install -e ".[dev]"

      - name: Verify tag matches pyproject.toml version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"   # Strip leading 'v'
          TOML_VERSION=$(python -c "
          import re
          content = open('pyproject.toml').read()
          m = re.search(r'^version\s*=\s*\"([^\"]+)\"', content, re.MULTILINE)
          print(m.group(1) if m else '')
          ")
          echo "Tag version:    $TAG"
          echo "pyproject.toml: $TOML_VERSION"
          if [ "$TAG" != "$TOML_VERSION" ]; then
            echo "FAIL: tag 'v$TAG' does not match pyproject.toml version '$TOML_VERSION'."
            echo "Update pyproject.toml and __init__.py before tagging."
            exit 1
          fi
          echo "OK: versions match."

      - name: Run unit tests
        env:
          DATABASE_URL: "sqlite:////tmp/test.db"
        run: pytest tests/unit/ -v --tb=short

      - name: Build distribution packages
        run: python -m build

      - name: Verify package metadata with twine
        run: twine check dist/*

      - name: Smoke-test wheel installation
        run: |
          python -m venv /tmp/test_env
          /tmp/test_env/bin/pip install --quiet dist/*.whl
          INSTALLED=$(/tmp/test_env/bin/python -c "import teshq; print(teshq.__version__)")
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "Installed version: $INSTALLED"
          echo "Expected version:  $TAG"
          if [ "$INSTALLED" != "$TAG" ]; then
            echo "FAIL: installed version '$INSTALLED' does not match tag '$TAG'."
            exit 1
          fi
          echo "OK: wheel installs and reports correct version."

      - name: Publish stable package to PyPI (OIDC)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          verbose: true

      - name: Create GitHub Stable Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: false   # Full stable release on GitHub
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
