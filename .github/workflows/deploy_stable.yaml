name: PyPI Stable Release

# Triggered ONLY when a stable version tag (no .dev) is pushed
# AND the tag's commit is reachable from the main branch.
# Example tag: v3.0.0
on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"  # Matches v3.0.0 but NOT v3.0.0.dev1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Verify tag is on main branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Fail if tag is not on main branch
        run: |
          TAG_COMMIT=$(git rev-parse "${{ github.ref }}")
          MAIN_TIP=$(git rev-parse origin/main)
          if ! git merge-base --is-ancestor "$TAG_COMMIT" "$MAIN_TIP"; then
            echo "Tag ${{ github.ref }} is NOT on the main branch. Stable releases must be tagged from main."
            exit 1
          fi
          echo "Tag is on main branch - proceeding with stable release."

      - name: Fail if tag is a dev pre-release
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" == *".dev"* ]]; then
            echo "Tag '$TAG' is a dev pre-release. Use deploy_dev.yaml for dev releases."
            exit 1
          fi
          echo "Stable version tag confirmed: $TAG"

  publish:
    name: Build and Publish Stable Release to PyPI
    runs-on: ubuntu-latest
    needs: guard
    permissions:
      id-token: write
      contents: write

    environment:
      name: pypi
      url: https://pypi.org/p/teshq

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel twine setuptools setuptools-scm
          pip install -e ".[dev]"

      - name: Verify version tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Deploying stable version tag: $TAG"

      - name: Run unit tests
        env:
          DATABASE_URL: "sqlite:////tmp/test.db"
        run: pytest tests/unit/ -v --tb=short

      - name: Build release package
        run: python -m build

      - name: Verify package distribution
        run: twine check dist/*

      - name: Test installation from wheel
        run: |
          python -m venv /tmp/test_env
          /tmp/test_env/bin/pip install dist/*.whl
          /tmp/test_env/bin/python -c "import teshq; print('Package installed successfully:', teshq.__version__)"

      - name: Publish stable package to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          verbose: true

      - name: Create GitHub Stable Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
