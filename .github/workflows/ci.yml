name: CI

on:
  push:
    branches: ["main", "dev", "enhancement"]
  pull_request:
    branches: ["main", "dev", "enhancement"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Style Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8 Linter
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 teshq/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 teshq/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools setuptools-scm build pytest pytest-cov

      - name: Install package (editable) with dev extras
        run: pip install -e ".[dev]"

      - name: Run unit tests with coverage
        env:
          DATABASE_URL: "sqlite:////tmp/test.db"
        run: pytest tests/unit/ -v --tb=short --cov=teshq --cov-report=term-missing

  build:
    name: Build & Verify Package
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools
        run: pip install build wheel twine setuptools setuptools-scm

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: twine check dist/*

      - name: Test installation from wheel
        run: |
          python -m venv /tmp/test_env
          /tmp/test_env/bin/pip install dist/*.whl
          /tmp/test_env/bin/python -c "import teshq; print('teshq', teshq.__version__)"
